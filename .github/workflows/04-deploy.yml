name: 04 Deploy Workflow

on:
  workflow_run:
    workflows: ["03 Build Workflow"]
    types: [completed]

env:
  AWS_REGION: us-east-1
  ECR_REPOSITORY: githubactions-demo
  IMAGE_TAG: latest
  CONTAINER_NAME: tiny-health-container
  APP_PORT: "8000"

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Get AWS Account ID
        id: account
        run: echo "account_id=$(aws sts get-caller-identity --query Account --output text)" >> $GITHUB_OUTPUT

      - name: Pull image from ECR
        run: |
          docker pull ${{ steps.account.outputs.account_id }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

      - name: Run container
        run: |
          docker run -d \
            --name $CONTAINER_NAME \
            -p $APP_PORT:8000 \
            ${{ steps.account.outputs.account_id }}.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY:$IMAGE_TAG

      # 🔍 DEBUG STEP 1
      - name: Show running containers
        run: docker ps -a

      # 🔍 DEBUG STEP 2
      - name: Show container logs
        run: docker logs $CONTAINER_NAME || true

      # ⏳ wait for app to start
      - name: Wait for app startup
        run: sleep 5

      # 🧪 Smoke test
      - name: Smoke test
        run: curl --fail http://127.0.0.1:$APP_PORT/health

      # 🧹 Cleanup
      - name: Cleanup
        if: always()
        run: docker rm -f $CONTAINER_NAME || true